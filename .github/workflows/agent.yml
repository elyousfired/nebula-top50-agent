name: agent

# Every 4h, 10 minutes after the UTC 4H slot (candles closed). If GitHub delays
# or skips a run, the next one rebuilds every missed slot from Bybit candles.
on:
  schedule:
    - cron: '10 */4 * * *'
  workflow_dispatch: {}

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout nebula-benchmark (Top 50 code of the site)
        uses: actions/checkout@v4
        with:
          repository: elyousfired/nebula-benchmark
          path: nebula-benchmark
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test test/
        env:
          BENCH_DIR: ${{ github.workspace }}/nebula-benchmark
      - name: Agent run
        run: node agent/run.js
        env:
          BENCH_DIR: ${{ github.workspace }}/nebula-benchmark
      - name: Commit data
        run: |
          git config user.name "nebula-agent"
          git config user.email "nebula-agent@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
